# For a traditional hyprlang config (~/.config/hypr/hyprland.conf).
# If you use the Lua config (hyprland.lua), use windowrule.lua instead.
#
# Source this file from hyprland.conf, or paste these lines in.
# The title must match view.DefaultTitle ("unifi-doorbell").
#
# The window SIZE is set by mpv itself (from window.width/height in
# config.json), so there is no `size` rule here — Hyprland 0.56.2 ignores
# `size`/`center` for floated windows set via rules (hyprwm/Hyprland#16446).
windowrulev2 = float, title:^(unifi-doorbell)$
windowrulev2 = center, title:^(unifi-doorbell)$
windowrulev2 = pin, title:^(unifi-doorbell)$
